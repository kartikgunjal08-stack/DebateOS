<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebateOS - Debate Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between pb-20">

    <div class="flex flex-col flex-1">
        
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md sticky top-0 z-40">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-indigo-500 rounded-full animate-pulse"></div>
                <h1 class="text-lg font-bold tracking-wide text-indigo-400">DebateOS <span class="text-xs font-normal text-slate-400">Arena</span></h1>
            </div>

            <!-- Profile Link -->
            <a href="profile.html" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 text-indigo-400 font-semibold rounded-full border border-slate-700 flex items-center justify-center transition shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </a>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4">

            <!-- Topic Setup Box -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3 shadow-lg">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-semibold text-indigo-300 uppercase tracking-wider">Debate Setup</h2>
                    <button onclick="endDebate()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-900/50 px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer">End Debate & Save</button>
                </div>
                <input type="text" id="debate-topic" placeholder="e.g., Artificial Intelligence will replace traditional software engineering" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                
                <div class="space-y-1">
                    <label class="text-xs text-slate-400">Choose Your Stance (AI will debate the opposite side):</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectStance('Pro')" id="stance-pro" class="p-2.5 border border-slate-800 bg-indigo-950/40 text-indigo-300 rounded-lg text-sm font-medium transition cursor-pointer">I am Pro (For)</button>
                        <button onclick="selectStance('Con')" id="stance-con" class="p-2.5 border border-slate-800 bg-slate-950 text-slate-400 rounded-lg text-sm font-medium transition cursor-pointer">I am Con (Against)</button>
                    </div>
                </div>
            </div>

            <!-- Chatbot Stream Box -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3 shadow-lg">
                <div id="chat-stream" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                    <div class="text-center text-xs text-slate-500 py-6">Enter a topic and your 1st argument below to start the debate.</div>
                </div>
                
                <div class="flex gap-2 pt-2 border-t border-slate-800">
                    <textarea id="user-argument" rows="2" placeholder="Type your argument..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                    <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 rounded-lg text-sm font-medium transition cursor-pointer">Send</button>
                </div>
            </div>

        </main>
    </div>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur border-t border-slate-800 py-2 px-6 flex justify-around items-center shadow-2xl">
        <a href="dashboard.html" class="flex flex-col items-center space-y-1 text-indigo-400 transition group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <span class="text-[10px] font-medium">Debate Arena</span>
        </a>

        <a href="history.html" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-[10px] font-medium">History</span>
        </a>
    </nav>



    <script src="app.js"></script>
</body>
</html>
