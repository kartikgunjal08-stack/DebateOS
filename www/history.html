<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebateOS - Debate History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between pb-20">

    <div class="flex flex-col flex-1">
        
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md sticky top-0 z-40">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-indigo-500 rounded-full animate-pulse"></div>
                <h1 class="text-lg font-bold tracking-wide text-indigo-400">DebateOS <span class="text-xs font-normal text-slate-400">History</span></h1>
            </div>

            <!-- Profile Link -->
            <a href="profile.html" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 text-indigo-400 font-semibold rounded-full border border-slate-700 flex items-center justify-center transition shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </a>
        </header>

        <!-- Main History Content -->
        <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4">
            <h2 class="text-sm font-semibold text-indigo-300 uppercase tracking-wider">Your Past Debate Sessions</h2>
            
            <div id="history-container" class="space-y-3">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center text-xs text-slate-400">
                    Loading debate history...
                </div>
            </div>
        </main>
    </div>

    <!-- Full Debate Transcript Pop-up Modal -->
    <div id="debate-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 space-y-4 shadow-2xl relative max-h-[85vh] flex flex-col">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div>
                    <h2 id="modal-topic-title" class="text-base font-bold text-white">Debate Transcript</h2>
                    <p id="modal-stance-info" class="text-xs text-indigo-400">Stance Details</p>
                </div>
                <button onclick="closeFullDebateModal()" class="text-slate-400 hover:text-white p-1 rounded-lg cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Scrollable Full Transcript Feed -->
            <div id="modal-transcript-container" class="space-y-3 overflow-y-auto pr-1 flex-1 text-xs">
                <!-- Dynamically injected transcript -->
            </div>

            <!-- Modal Footer -->
            <div class="border-t border-slate-800 pt-3 flex justify-end">
                <button onclick="closeFullDebateModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-xs transition cursor-pointer">Close</button>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur border-t border-slate-800 py-2 px-6 flex justify-around items-center shadow-2xl">
        <a href="dashboard.html" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <span class="text-[10px] font-medium">Debate Arena</span>
        </a>

        <a href="history.html" class="flex flex-col items-center space-y-1 text-indigo-400 transition group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-[10px] font-medium">History</span>
        </a>
    </nav>

    <footer class="fixed bottom-14 left-0 right-0 z-30 bg-slate-900/90 border-t border-slate-800/60 py-1.5 px-4 text-center pointer-events-none">
        <p class="text-[10px] text-amber-400/90 font-medium tracking-wide">
            ⚠️ It is a college project just for testing and educational purposes.
        </p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
