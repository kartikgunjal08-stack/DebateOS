<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebateOS - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md space-y-6 shadow-2xl">
        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-indigo-600/10 border border-indigo-500/20 rounded-xl text-indigo-400 mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Create Account</h1>
            <p class="text-xs text-slate-400">Join DebateOS to analyze arguments and run smart simulations</p>
        </div>

        <!-- Signup Form -->
        <div class="space-y-4">
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-300">Email Address</label>
                <input type="email" id="signup-email" placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
            
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-300">Password</label>
                <div class="relative">
                    <input type="password" id="signup-password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 pr-10 text-sm focus:outline-none focus:border-indigo-500 transition">
                    <button type="button" onclick="togglePasswordVisibility('signup-password', 'signup-eye-icon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 cursor-pointer">
                        <svg id="signup-eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button onclick="handleSignup()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm cursor-pointer">Create Account</button>
        </div>

        <!-- Footer link to Login -->
        <p class="text-center text-xs text-slate-400">
            Already have an account? <a href="login.html" class="text-indigo-400 font-medium hover:underline">Log in</a>
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
